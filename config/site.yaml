# yaml-language-server: $schema=https://json-schema.org/draft-07/schema
# =============================================================================
# Site Configuration
# =============================================================================
# This file contains all site-specific configurations.
# Modify this file to customize your blog.
# After changes, rebuild the site: pnpm build
# =============================================================================

# =============================================================================
# Site Basic Information
# =============================================================================
site:
  title: hainoir 的博客 # 网站名称
  alternate: hainoir # 网站英文名称 用于页脚、Logo、@ handle 等
  subtitle: 前端、算法与长期主义的技术笔记 # 网站副标题
  name: hainoir # 作者名称 - 请修改为你的名字
  description: 记录前端实践、算法推演和那些值得反复理解的问题。 # 网站描述
  avatar: /img/hainoir-avatar.png # 网站头像
  showLogo: false # 使用站点名称显示 Logo
  author: hainoir # 作者名称 - 请修改为你的名字
  url: https://hainoir.github.io/ # 站点 URL 用于 RSS 和 SEO
  defaultOgImage: /og/site.png # 构建时自动生成的站点分享卡片
  startYear: 2025 # 建站年份
  timezone: Asia/Hong_Kong # 时区配置 (IANA 格式)，用于日期显示和处理
  keywords:
    - hainoir
    - 前端
    - 算法
    - React
    - TypeScript
    - JavaScript
i18n:
  defaultLocale: zh
  locales:
    - code: zh
      label: 中文

# =============================================================================
# Category Map
# Maps Chinese category names to URL-friendly English slugs
# Example: '随笔' category URL becomes /categories/life
# =============================================================================
categoryMap:
  前端: front-end
  算法: algorithm
  工具: tools
featuredCategories:
  - link: front-end
    label: 前端
    image: /img/cover/1.webp
    description: React、TypeScript 与 JavaScript 实践
  - link: algorithm
    label: 算法
    image: /img/cover/4.webp
    description: 数据结构、算法推演与解题笔记
  - link: tools
    label: 工具
    image: /img/cover/11.webp
    description: 开发工具与效率提升

# =============================================================================
# Featured Series
# 精选系列功能 - 用于展示定期更新的系列内容（支持多个系列）
# =============================================================================
# 字段说明：
#   slug: URL 路径（必填），如 'weekly' 对应 /weekly 路径
#         注意：不能与保留路由冲突，包括：about, categories, tags, friends, posts, archives, api, _astro, rss.xml, sitemap.xml, robots.txt, favicon.ico 等
#   categoryName: 对应的分类名称（必填，需在 categoryMap 中存在）
#   label: 侧边栏/导航中显示的简短名称（可选）
#   fullName: 系列页面标题显示的完整名称（可选）
#   description: 系列介绍文字，支持多行 Markdown（可选）
#   cover: 系列页面头图路径，相对于 public 目录（可选）
#   enabled: 是否启用此系列，设为 false 可关闭（可选，默认 true）
#   icon: 导航图标，Iconify 格式如 'ri:newspaper-line'（可选）
#   highlightOnHome: 是否在首页高亮显示最新文章（可选，默认 true，显式设为 false 可禁用）
#   readingOrder: 推荐阅读顺序，填写文章 frontmatter 的 link；未列出的新文章会追加在末尾
#   links: 相关链接配置（可选）
# -----------------------------------------------------------------------------
featuredSeries:
  - slug: frontend-notes
    categoryName: 前端
    label: 前端手记
    fullName: 前端手记：语言与组件
    description: >-
      从 JavaScript 的职责分离与组件封装，到 TypeScript 的类型系统与泛型，
      再到 React 的 Effect、自定义 Hook，按语言基础到组件逻辑的顺序复习。
    cover: /img/cover/1.webp
    icon: ri:code-s-slash-line
    highlightOnHome: false
    enabled: true
    readingOrder:
      - bea3b2c9
      - e86ee304
      - d8a440d1
  - slug: algorithm-notes
    categoryName: 算法
    label: 算法手记
    fullName: 算法手记：思路与模板
    description: >-
      记录前缀和、差分、二分、常用容器、树状数组与图遍历的思路和代码模板，
      配合 C++ 与 Java 基础方法速查，在理解问题之后再回看实现。
    cover: /img/cover/4.webp
    icon: ri:braces-line
    highlightOnHome: false
    enabled: true
    readingOrder:
      - 5513a8e3
      - 32c27e41
      - ca70cb17
      - aa3f72d6
      - f569f5a2
      - 62da137b
      - a72304e1
      - b74716b
      - b324aa57
      - 2f8a531c
social:
  github:
    url: https://github.com/hainoir
    icon: ri:github-fill
    color: "#191717"
  rss:
    url: /rss.xml
    icon: ri:rss-line
    color: "#ff6600"
friends:
  intro:
    title: 友情链接 # 页面标题
    subtitle: 欢迎交换友链！ # 页面副标题
    applyTitle: 申请友链 # 申请区块标题
    applyDesc: 请在本页留言，格式如下 # 申请说明
    exampleYaml: | # 申请格式示例，会显示在页面上
      - site: 你的博客名称 # 站点名称
        url: https://your-blog.com/ # 站点网址
        owner: 你的昵称 # 昵称
        desc: 站点简介 # 站点简介
        image: https://your-blog.com/avatar.jpg # 头像链接
        color: "#ffc0cb" # 主题色（可选）
  data: []

# =============================================================================
# Announcements
# 公告系统 - 在页面顶部显示重要通知
# =============================================================================
# 字段说明：
#   id: 唯一标识符，用于记录用户已读状态（localStorage）
#   title: 公告标题
#   content: 公告内容文字
#   type: 类型，影响样式颜色 (info/success/warning/error)
#   priority: 优先级数字，数值越大排序越靠前
#   color: (可选) 自定义颜色，覆盖 type 默认色
#   publishDate: 发布日期，格式 'YYYY-MM-DD'
#   startDate: (可选) 开始显示时间，ISO 8601 格式
#   endDate: (可选) 结束显示时间，过期后自动隐藏
#   link: (可选) 相关链接
#     url: 链接地址
#     text: 链接文字
#     external: 是否在新窗口打开 (true/false)
# -----------------------------------------------------------------------------
# 取消下方注释即可启用公告示例：
# -----------------------------------------------------------------------------
announcements: []

# =============================================================================
# Default Cover List
# 默认封面列表 - 文章没有指定封面时将随机从列表中选择一张作为封面
# 不设置则使用内置的 21 张默认封面 (/img/cover/1~21.webp)
# =============================================================================
# defaultCoverList:
#   - /img/cover/1.webp
#   - https://example.com/custom-cover.webp


# =============================================================================
# Content Processing Options
# 内容处理选项 - 控制文章渲染和交互行为
# =============================================================================
# 字段说明：
#   addBlankTarget: 外部链接在新窗口打开
#   smoothScroll: 启用平滑滚动动画
#   addHeadingLevel: 自动为标题添加层级锚点
#   enhanceCodeBlock: 增强代码块样式（行号、语言标签等）
#   enableCodeCopy: 显示代码块复制按钮
#   enableCodeFullscreen: 显示代码块全屏按钮
#   enableLinkEmbed: 启用链接卡片预览（解析 OG 信息）
#   enableTweetEmbed: 启用推文嵌入展示
#   enableOGPreview: 启用 Open Graph 预览卡片
#   previewCacheTime: 预览信息缓存时间（秒）
#   lazyLoadEmbeds: 延迟加载嵌入内容（提升性能）
#   postCardImagePosition: 文章卡片封面图位置 (alternating/left/right)
# -----------------------------------------------------------------------------
content:
  addBlankTarget: true # 外部链接新窗口打开
  smoothScroll: true # 平滑滚动
  addHeadingLevel: true # 标题锚点
  enhanceCodeBlock: true # 增强代码块
  enableCodeCopy: true # 代码复制按钮
  enableCodeFullscreen: true # 代码全屏按钮
  enableLinkEmbed: false # 链接卡片预览
  enableTweetEmbed: false # 推文嵌入
  enableOGPreview: false # OG 预览卡片
  previewCacheTime: 3600 # 预览缓存时间(秒)
  lazyLoadEmbeds: true # 延迟加载嵌入
  postCardImagePosition: alternating # 文章卡片封面图位置在首页的显示控制 alternating 默认交替显示 left 封面图始终在左侧 right 封面图始终在右侧
  # Shoka 兼容功能（默认全部启用，设为 false 可关闭）
  enableShokaContainers: true # :::提醒块 ;;;标签卡 +++折叠块
  enableShokaAttrs: true # [text]{.class} 属性语法
  enableShokaEffects: true # ++下划线++ ==高亮== ~下标~ ^上标^
  enableShokaSpoiler: true # !!隐藏文字!!
  enableShokaRuby: true # {文字^注音} 注音标注
  enableShokaHexoTags: true # {% links %} {% media %} Hexo标签
  enableMath: true # $数学公式$ KaTeX渲染
  enableCodeMeta: true # 代码块增强 (title, mark, command)
  enableQuiz: true # 练习题交互功能
  enableEncryptedBlock: false # :::encrypted{password="..."} 加密内容块

# =============================================================================
# Navigation Routes
# 导航菜单配置 - 定义顶部导航栏的菜单项
# =============================================================================
# 字段说明：
#   name: 菜单项显示名称
#   path: 链接路径（有 children 时可省略，点击展开子菜单）
#   icon: Iconify 图标标识，格式 "集合:图标名"
#   children: (可选) 子菜单列表，结构与父级相同
# -----------------------------------------------------------------------------
# 图标参考：
#   - Font Awesome 6: https://icon-sets.iconify.design/fa6-solid/
#   - Remix Icon: https://icon-sets.iconify.design/ri/
# -----------------------------------------------------------------------------
navigation:
  - name: 首页
    nameKey: nav.home
    path: /
    icon: ri:home-heart-fill
  - name: 专栏
    icon: ri:book-open-line
    children:
      - name: 前端手记
        path: /frontend-notes
        icon: ri:code-s-slash-line
      - name: 算法手记
        path: /algorithm-notes
        icon: ri:braces-line
  - name: 文章
    nameKey: nav.posts
    icon: ri:quill-pen-ai-fill
    children:
      - name: 分类
        nameKey: nav.categories
        path: /categories
        icon: ri:grid-fill
      - name: 标签
        nameKey: nav.tags
        path: /tags
        icon: fa6-solid:tags
      - name: 归档
        nameKey: nav.archives
        path: /archives
        icon: ri:archive-2-fill
  - name: 关于
    nameKey: nav.about
    path: /about
    icon: fa6-regular:circle-user
comment:
  provider: giscus
  giscus:
    repo: hainoir/hainoir.github.io
    repoId: R_kgDOPYANAA
    category: Announcements
    categoryId: DIC_kwDOPYANAM4DIZKF
    mapping: specific # 用稳定文章 link 关联评论，修改标题不会丢失评论
    strict: "1"
    reactionsEnabled: "1"
    emitMetadata: "0"
    inputPosition: top
    lang: zh-CN
    loading: lazy
analytics:
  umami:
    enabled: true
    id: 537dadcf-c188-40d5-81fb-64c05d04403a
    endpoint: https://cloud.umami.is/script.js

# =============================================================================
# SEO Configuration
# =============================================================================
# https://github.com/alextim/astro-lib/tree/main/packages/astro-robots-txt#readme
# robots: robots.txt 配置 (由 astro-robots-txt 自动生成)
#   policy: 爬虫策略数组（可选，默认允许所有）
#     - userAgent: 爬虫名称，'*' 表示所有
